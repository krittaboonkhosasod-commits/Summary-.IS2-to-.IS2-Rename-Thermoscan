<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>THERMIFY PRO – เปลี่ยนชื่อไฟล์ IS2</title>
<style>
:root{--ink:#000;--mute:rgba(60,60,67,.62);--line:rgba(60,60,67,.18);--sep:rgba(60,60,67,.18);--glass2:rgba(255,255,255,.9);--fld:rgba(118,118,128,.12);--field:rgba(118,118,128,.12);--acc:#007aff;--acs:rgba(0,122,255,.14);--accink:#fff;--ok:#1c8a3a;--bad:#c62828;--warn:#b45f06;--sh:rgba(20,30,80,.14);--bg1:#eef2ff;--bg2:#efe6fb;--bg3:#f9d5ea;--bg4:#c9f2d8}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{min-height:100%}
body{margin:0;min-height:100vh;color:var(--ink);font:17px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue","Segoe UI",system-ui,"Noto Sans Thai",Tahoma,sans-serif;-webkit-font-smoothing:antialiased;letter-spacing:-.01em;
  background:radial-gradient(60vmax 60vmax at 8% 4%,var(--bg1),transparent 60%),radial-gradient(55vmax 55vmax at 95% 12%,var(--bg2),transparent 60%),radial-gradient(60vmax 60vmax at 80% 100%,var(--bg3),transparent 60%),radial-gradient(55vmax 55vmax at 5% 95%,var(--bg4),transparent 60%),var(--bg1);background-attachment:fixed}
.brand{position:absolute;left:12px;top:6px;display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700;letter-spacing:.02em;z-index:3}
.brand small{font-weight:500;color:var(--mute);font-size:1em}
.foot{position:fixed;right:14px;bottom:10px;z-index:0;pointer-events:none;user-select:none;font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);opacity:.55}
.shell{position:relative;z-index:1;max-width:860px;margin:0 auto;padding:50px 16px 60px}
.card{position:relative;width:100%;margin:0 0 18px;padding:14px 17px 16px;border-radius:24px;background:linear-gradient(135deg,rgba(186,230,253,.85),rgba(199,215,254,.8));box-shadow:0 10px 34px var(--sh),inset 0 1px 0 rgba(255,255,255,.85)}
.card h1{margin:0 0 5px 4px;font-size:clamp(17px,5vw,21px);line-height:30px;font-weight:700;letter-spacing:0}
.bigc{position:absolute;right:20px;top:6px;width:84px;height:auto;z-index:3;filter:drop-shadow(0 6px 8px rgba(0,40,120,.3));pointer-events:none}
.fold{position:relative;filter:drop-shadow(0 8px 18px var(--sh))}
.fold::before{content:"";position:absolute;inset:0;background:rgba(255,255,255,.3);border-radius:26px}
.tabs{position:relative;z-index:1;display:flex;overflow-x:auto;overflow-y:hidden}
.tab{position:relative;z-index:1;flex:none;appearance:none;border:0;background:transparent;font:inherit;font-size:16px;font-weight:500;letter-spacing:inherit;color:#40506a;padding:9px 26px 6px 16px;border-radius:22px 22px 0 0;cursor:pointer;white-space:nowrap}
.tab[aria-selected="true"]{background:var(--glass2);color:var(--ink);margin-right:22px}
.tab:first-child[aria-selected="true"]{border-radius:22px 0 0 0}
.tab[aria-selected="true"]::after{content:"";position:absolute;right:-22px;bottom:0;width:22px;height:22px;pointer-events:none;background:radial-gradient(circle at 100% 0,transparent 21px,var(--glass2) 22px)}
.tab[aria-selected="true"]:not(:first-child){margin-left:22px}
.tab[aria-selected="true"]:not(:first-child)::before{content:"";position:absolute;left:-22px;bottom:0;width:22px;height:22px;pointer-events:none;background:radial-gradient(circle at 0 0,transparent 21px,var(--glass2) 22px)}
.tab:focus-visible{outline:2px solid var(--acc);outline-offset:-2px}
.sheet{position:relative;z-index:1;background:var(--glass2);border-radius:24px;padding:8px 11px 24px;min-height:240px}
.sheet[data-tab="0"]{border-radius:0 24px 24px 24px}
.pane[hidden]{display:none}
.cvrow{display:flex;justify-content:flex-end;margin:0 0 14px}
.conv{margin-left:auto;display:flex;align-items:center;gap:0}
.conv>svg{width:40px;height:40px;flex:none;filter:drop-shadow(0 3px 6px rgba(0,0,0,.2))}
.mid{position:relative;display:flex;align-items:center}
.mrow{display:flex;align-items:center}
.ln{display:block;flex:none;width:18px;height:1.5px;border-radius:2px}
.ln.ll{background:linear-gradient(90deg,rgba(255,69,58,0),rgba(255,69,58,.75));margin-left:2px}
.ln.rr{background:linear-gradient(90deg,rgba(255,69,58,.75),rgba(255,69,58,0));margin-right:2px}
.cto{font-size:10px;font-weight:600;letter-spacing:.3em;padding-left:.3em;position:absolute;top:100%;left:50%;transform:translateX(-50%);margin-top:3px;line-height:1;white-space:nowrap;color:var(--mute)}
.sw{flex:none;filter:drop-shadow(0 0 5px rgba(255,69,58,.55))}
@keyframes swing{0%,100%{transform:rotate(0)}50%{transform:rotate(180deg)}}
.spin{transform-box:view-box;transform-origin:15px 15px;animation:swing 2.4s ease-in-out infinite}
@media(prefers-reduced-motion:reduce){.spin{animation:none}*{transition:none!important}}
.drop{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;text-align:center;padding:20px 12px;border:1.5px dashed var(--sep);border-radius:22px;background:var(--fld);cursor:pointer;transition:.2s}
.drop>svg{width:46px;height:46px;margin-bottom:8px;filter:drop-shadow(0 6px 10px rgba(0,60,160,.3))}
@keyframes upbob{0%,100%{transform:translateY(2px);opacity:.75}50%{transform:translateY(-2px);opacity:1}}
.uparrow{transform-box:fill-box;animation:upbob 1.2s ease-in-out infinite}
.drop:hover .uparrow,.drop.over .uparrow{animation-duration:.6s}
@media(prefers-reduced-motion:reduce){.uparrow{animation:none}}
.drop:hover,.drop.over,.drop:focus-visible{background:var(--acs);border-color:var(--acc);outline:none}
.drop:active{transform:scale(.99)}
.drop .big{display:block;font-weight:600;font-size:13.5px}
.drop .small{display:block;color:var(--mute);font-size:11px}
.info{margin-top:10px;color:var(--mute);font-size:.88rem;text-align:center}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-bottom:12px}
label{display:block;font-size:.82rem;color:var(--mute)}
input[type=text],input:not([type]),select{width:100%;margin-top:3px;padding:10px 14px;border:0;border-radius:14px;background:var(--fld);color:var(--ink);font:inherit;font-size:15px;outline:none;transition:box-shadow .15s,background .15s}
input[type=text]:focus,input:not([type]):focus,select:focus{background:var(--glass2);box-shadow:0 0 0 3px rgba(0,122,255,.4)}
button:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.tbl{overflow:auto;max-height:55vh;border-radius:20px;background:var(--glass2);border:.5px solid var(--sep)}
table{width:100%;border-collapse:separate;border-spacing:0;min-width:620px;table-layout:fixed}
th:first-child,td:first-child{width:3.8em}
th,td{text-align:left;padding:8px 10px;border-bottom:.5px solid var(--sep);overflow-wrap:anywhere;font-size:.88rem}
tr:last-child td{border-bottom:0}
th:nth-child(2),td:nth-child(2){width:36%}
th{font-weight:500;color:var(--mute);font-size:.8rem;position:sticky;top:0;z-index:1;background:var(--glass2)}
td.new{font-weight:600}
td.bad,td.miss{color:var(--bad)}
td.miss{font-weight:400}
td.dup{color:var(--warn);font-weight:600}
td.keep{color:var(--mute)}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;align-items:center}
button.b{padding:10px 18px;border-radius:99px;border:1px solid var(--acc);background:var(--acc);color:var(--accink);font:inherit;font-size:15px;font-weight:600;cursor:pointer;transition:transform .15s,opacity .15s}
button.b:active{transform:scale(.97);opacity:.92}
button.b.alt{background:var(--acs);color:var(--acc);border-color:transparent}
button.b:disabled{opacity:.4;cursor:not-allowed}
#msg{color:var(--mute);min-height:1.5em;margin-top:10px;font-size:.9rem}
#msg.bad{color:var(--bad)}#msg.ok{color:var(--ok)}
details{margin-bottom:12px}
summary{cursor:pointer;color:var(--mute);font-size:.88rem;margin-bottom:8px}
@media (max-width:640px){.card h1{max-width:calc(100% - 96px)}.bigc{width:68px;right:14px}.tab{padding:9px 16px 6px 10px;font-size:13.5px}.tab[aria-selected="true"]{margin-right:16px}.tab[aria-selected="true"]:not(:first-child){margin-left:16px}.tab[aria-selected="true"]::after{right:-16px;width:16px;height:16px;background:radial-gradient(circle at 100% 0,transparent 15px,var(--glass2) 16px)}.tab[aria-selected="true"]:not(:first-child)::before{left:-16px;width:16px;height:16px;background:radial-gradient(circle at 0 0,transparent 15px,var(--glass2) 16px)}}
</style>
</head>

/* ---------- อ่านไฟล์ .xlsx (ไม่ต้องใช้ไลบรารีภายนอก) ---------- */
async function unzip(buf){
  const dv = new DataView(buf), u8 = new Uint8Array(buf);
  let e = u8.length - 22;
  while (e >= 0 && dv.getUint32(e, true) !== 0x06054b50) e--;
  if (e < 0) throw new Error('ไม่ใช่ไฟล์ xlsx');
  const n = dv.getUint16(e + 10, true); let p = dv.getUint32(e + 16, true);
  const dec = new TextDecoder(), out = {};
  for (let i = 0; i < n; i++){
    if (dv.getUint32(p, true) !== 0x02014b50) throw new Error('โครงสร้างไฟล์ xlsx ไม่ถูกต้อง');
    const method = dv.getUint16(p + 10, true), csize = dv.getUint32(p + 20, true);
    const nl = dv.getUint16(p + 28, true), el = dv.getUint16(p + 30, true), cl = dv.getUint16(p + 32, true);
    const lho = dv.getUint32(p + 42, true);
    const name = dec.decode(u8.subarray(p + 46, p + 46 + nl));
    const ds = lho + 30 + dv.getUint16(lho + 26, true) + dv.getUint16(lho + 28, true);
    out[name] = { method, data: u8.subarray(ds, ds + csize) };
    p += 46 + nl + el + cl;
  }
  return async name => {
    const f = out[name]; if (!f) return null;
    if (f.method === 0) return dec.decode(f.data);
    if (f.method !== 8) throw new Error('ไฟล์ xlsx ใช้การบีบอัดที่ไม่รองรับ');
    if (typeof DecompressionStream === 'undefined') throw new Error('เบราว์เซอร์นี้อ่านไฟล์ xlsx ไม่ได้ กรุณาอัปเดตเบราว์เซอร์ (Chrome / Edge / Safari รุ่นใหม่)');
    const ds = new Blob([f.data]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
    return dec.decode(await new Response(ds).arrayBuffer());
  };
}
const unesc = s => s.replace(/&#x([0-9a-f]+);/gi, (_, h) => String.fromCodePoint(parseInt(h, 16)))
  .replace(/&#(\d+);/g, (_, d) => String.fromCodePoint(+d))
  .replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&quot;/g, '"').replace(/&apos;/g, "'").replace(/&amp;/g, '&');
const attr = (tag, k) => { const m = tag.match(new RegExp('(?:^|\\s)' + k + '="([^"]*)"')); return m ? unesc(m[1]) : null; };
const texts = x => [...x.matchAll(/<t[^>]*>([\s\S]*?)<\/t>/g)].map(m => unesc(m[1])).join('');

async function parseSummary(buf){
  const get = await unzip(buf);
  const wb = await get('xl/workbook.xml');
  if (!wb) throw new Error('ไม่พบข้อมูลสมุดงาน');
  const sheets = [...wb.matchAll(/<sheet\s[^>]*>/g)].map(m => ({ name: attr(m[0], 'name'), rid: attr(m[0], 'r:id') }));
  const rels = await get('xl/_rels/workbook.xml.rels') || '';
  const target = {}; for (const m of rels.matchAll(/<Relationship\s[^>]*>/g)) target[attr(m[0], 'Id')] = attr(m[0], 'Target');
  const sh = sheets.find(s => /summary/i.test(s.name)) || sheets[0];
  if (!sh) throw new Error('ไม่พบชีตในไฟล์');
  let path = target[sh.rid] || 'worksheets/sheet1.xml';
  path = path.startsWith('/') ? path.slice(1) : 'xl/' + path;
  const ss = await get('xl/sharedStrings.xml');
  const shared = ss ? [...ss.matchAll(/<si[\s>][\s\S]*?<\/si>|<si\/>/g)].map(m => texts(m[0].replace(/<rPh[\s\S]*?<\/rPh>/g, ''))) : [];
  const xml = await get(path);
  if (!xml) throw new Error('อ่านชีต ' + sh.name + ' ไม่ได้');
  const rows = [], seenNo = new Set(); let skipped = 0, dupNo = 0;
  for (const rm of xml.matchAll(/<row\s[^>]*?(?:\/>|>([\s\S]*?)<\/row>)/g)){
    if (!rm[1]) continue;
    const cells = {};
    for (const cm of rm[1].matchAll(/<c\s([^>]*?)(?:\/>|>([\s\S]*?)<\/c>)/g)){
      const col = (attr(cm[1], 'r') || '').replace(/\d+/g, ''), t = attr(cm[1], 't'), body = cm[2] || '';
      let v = null;
      if (t === 'inlineStr') v = texts(body);
      else { const vm = body.match(/<v>([\s\S]*?)<\/v>/); if (vm) v = t === 's' ? (shared[+vm[1]] ?? '') : unesc(vm[1]); }
      if (v !== null) cells[col] = v.trim();
    }
    const no = /^\d+(\.0+)?$/.test(cells.A || '') ? parseInt(cells.A, 10) : NaN;
    if (isNaN(no) || no < 1) continue;
    const colIdx = c => c.split('').reduce((s, ch) => s * 26 + ch.charCodeAt(0) - 64, 0);
    const vals = Object.keys(cells).filter(c => c !== 'A' && cells[c] !== '').sort((a, b) => colIdx(a) - colIdx(b)).map(c => cells[c].replace(/\s+/g, ' ').trim());
    if (vals.length < 4){ skipped++; continue; }
    if (seenNo.has(no)){ dupNo++; continue; }
    seenNo.add(no); rows.push([no, vals[0], vals[1], vals[2], vals[3]]);
  }
  if (!rows.length) throw new Error('ไม่พบตารางข้อมูล (แถวข้อมูลต้องขึ้นต้นด้วยเลข No. ตามด้วย Floor, Room, Devices, Detail)');
  return { rows, sheet: sh.name, skipped, dupNo };
}

async function loadSummary(file){
  let ok = false, warn = false;
  try {
    const { rows, sheet, skipped, dupNo } = await parseSummary(await file.arrayBuffer());
    DATA = rows; MAP = new Map(rows.map(r => [r[0], r]));
    summarySource = 'ใช้ไฟล์ ' + file.name + ' (ชีต ' + sheet + ') — ' + rows.length + ' รายการ'
      + (skipped ? ' | ข้าม ' + skipped + ' แถวที่ข้อมูลไม่ครบ 4 ช่อง' : '')
      + (dupNo ? ' | ข้าม ' + dupNo + ' แถวที่เลข No. ซ้ำ' : '');
    ok = true; warn = !!(skipped || dupNo);
  } catch (e) {
    summarySource = 'อ่านไฟล์ ' + file.name + ' ไม่สำเร็จ: ' + e.message + ' (ยังใช้ตารางเดิมอยู่)';
  }
  const col = ok ? (warn ? 'var(--warn)' : 'var(--ok)') : 'var(--bad)';
  $('xinfo').style.color = col; $('xinfo2').style.color = col;
  render();
  if (ok) showTab(1);

const $ = id => document.getElementById(id);
const BAD = /[\\/:*?"<>|\u0000-\u001f]/g;
let files = [];   // {file, no, ext}
let names = [];

function say(t, cls){ const m = $('msg'); m.textContent = t; m.className = cls || ''; }

function stemFor(no){
  const r = MAP.get(no); if (!r) return null;
  const sep = $('sep').value;
  const n = $('noMode').value === 'pad' ? String(no).padStart(2, '0') : String(no);
  return [n, r[1], r[2], r[3], r[4]].join(sep).replace(BAD, '_');
}

let OUT = [];   // รายการไฟล์ที่จะบันทึกจริง {file, name, keep}

const fileKey = f => f.name + '|' + f.size + '|' + f.lastModified;
function addFiles(list){
  const arr = Array.from(list || []);            // คัดลอกไว้ก่อน เพราะ FileList จะถูกล้างหลังจบฟังก์ชัน
  if (!arr.length) return;
  const have = new Set(files.map(x => fileKey(x.file)));
  let same = 0;
  for (const f of arr){
    const k = fileKey(f);
    if (have.has(k)){ same++; continue; }          // ไฟล์เดียวกันเป๊ะ (ชื่อ/ขนาด/วันที่แก้ไข) ที่เลือกซ้ำ ไม่นับเป็นไฟล์ซ้ำ
    have.add(k);
    const m = f.name.match(/^\s*(\d+)/);          // ยึดเฉพาะตัวเลขติดกันที่อยู่หน้าสุดของชื่อไฟล์
    const dot = f.name.lastIndexOf('.');
    files.push({
      file: f,
      no: m ? parseInt(m[1], 10) : NaN,
      pure: /^\d+\.[^.]+$/.test(f.name),           // ชื่อแบบ 309.IS2 (เลขล้วน) ถือเป็นไฟล์ต้นฉบับ
      ext: dot > 0 ? f.name.slice(dot + 1) : ''
    });
  }
  files.sort((a, b) => {
    const x = isNaN(a.no) ? 1e12 : a.no, y = isNaN(b.no) ? 1e12 : b.no;
    if (x !== y) return x - y;
    if (a.pure !== b.pure) return a.pure ? -1 : 1;
    return a.file.name.localeCompare(b.file.name, undefined, { numeric: true });
  });
  render();
  if (same) $('msg').textContent += ' | ข้ามไฟล์ที่เลือกซ้ำ ' + same + ' ไฟล์';
  showTab(2);
}

function render(){
  $('xinfo').textContent = summarySource; $('xinfo2').textContent = 'ตารางที่ใช้: ' + summarySource;
  const tb = $('rows'); tb.textContent = '';
  const word = $('dupWord').value.trim() || 'ซ้ำ';
  const seen = {};
  const matched = new Set();
  let nDup = 0, nKeep = 0, nNew = 0;
  names = []; 
  const info = files.map(x => {
    const stem = isNaN(x.no) ? null : stemFor(x.no);
    if (stem === null){ names.push(x.file.name); return { keep: true, why: isNaN(x.no) ? 'ไม่มีเลขนำหน้า — ไม่เปลี่ยนชื่อ' : 'ไม่มีเลข ' + x.no + ' ในตาราง — ไม่เปลี่ยนชื่อ' }; }
    const key = stem.toLowerCase() + '.' + x.ext.toLowerCase();
    const c = seen[key] = (seen[key] || 0) + 1;
    const tail = c === 1 ? '' : ' ' + word + (c > 2 ? c - 1 : '');
    matched.add(x.no);
    const nm = stem + tail + (x.ext ? '.' + x.ext : '');
    names.push(nm);
    return { keep: false, dup: c > 1, nm };
  });
  /* ชื่อที่จะบันทึกต้องไม่ชนกันเอง (ไม่สนตัวพิมพ์เล็ก/ใหญ่ เพราะ Windows/macOS ถือว่าเป็นชื่อเดียวกัน) */
  const used = new Set(), incKeep = $('incKeep').checked;
  info.forEach((f, i) => {
    if (f.keep && !incKeep) return;
    const orig = f.keep ? files[i].file.name : f.nm;
    const dot = orig.lastIndexOf('.'), base = dot > 0 ? orig.slice(0, dot) : orig, ext = dot > 0 ? orig.slice(dot) : '';
    let nm = orig, k = 1;
    while (used.has(nm.toLowerCase())) nm = base + ' (' + (++k) + ')' + ext;
    used.add(nm.toLowerCase());
    names[i] = nm;
    if (nm !== orig){ f.nm = nm; f.forced = true; if (!f.keep) f.dup = true; }
  });
  OUT = files.map((x, i) => ({ file: x.file, name: names[i], keep: info[i].keep }))
             .filter(o => !o.keep || $('incKeep').checked);

  const add = (a, b, c, cls) => {
    const tr = document.createElement('tr');
    [a, b, c].forEach((v, k) => { const td = document.createElement('td'); td.textContent = v; if (k === 2) td.className = cls; tr.appendChild(td); });
    tb.appendChild(tr);
  };
  if (!files.length){
    DATA.forEach(r => add(r[0], '—', stemFor(r[0]) + '.IS2', 'new'));
  } else {
    files.forEach((x, i) => {
      const f = info[i];
      if (f.keep){ nKeep++; add(isNaN(x.no) ? '' : x.no, x.file.name, f.why + (f.forced ? ' (ชื่อชน จึงบันทึกเป็น ' + f.nm + ')' : ''), 'keep'); }
      else if (f.dup){ nDup++; add(x.no, x.file.name, f.nm + '  (ซ้ำ)', 'dup'); }
      else { nNew++; add(x.no, x.file.name, f.nm, 'new'); }
    });
    const miss = DATA.map(r => r[0]).filter(n => !matched.has(n));
    if (miss.length){
      const tr = document.createElement('tr'), td = document.createElement('td');
      td.colSpan = 3; td.className = 'miss';
      td.textContent = 'ยังไม่ได้เลือกไฟล์เลข: ' + (miss.length > 20 ? miss.slice(0, 20).join(', ') + ' ... (รวมอีก ' + (miss.length - 20) + ' เลข)' : miss.join(', '));
      tr.appendChild(td); tb.appendChild(tr);
    }
  }
  const ok = OUT.length > 0;
  ['zip', 'each', 'folder'].forEach(id => $(id).disabled = !ok);
  $('inplace').disabled = !(nNew + nDup > 0);
  $('clear').disabled = !files.length;
  if (!files.length) say('ตารางด้านล่างคือชื่อใหม่ทั้งหมดตาม Summary เลือกไฟล์ .IS2 เพื่อเริ่มเปลี่ยนชื่อ');
  else say('เปลี่ยนชื่อ ' + nNew + ' ไฟล์ | ชื่อซ้ำ (ใส่ "' + word + '" ต่อท้าย) ' + nDup + ' ไฟล์ | ไม่เปลี่ยนชื่อ ' + nKeep + ' ไฟล์', 'ok');
}

/* ---------- ZIP (ไม่บีบอัด) ---------- */
const CRC = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++){ let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
function crc32(u8){ let c = 0xFFFFFFFF; for (let i = 0; i < u8.length; i++) c = CRC[(c ^ u8[i]) & 255] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; }

async function buildZip(){
  const enc = new TextEncoder(), parts = [], central = [];
  const d = new Date();
  const time = (d.getHours() << 11) | (d.getMinutes() << 5) | (d.getSeconds() >> 1);
  const date = ((d.getFullYear() - 1980) << 9) | ((d.getMonth() + 1) << 5) | d.getDate();
  let offset = 0;
  for (let i = 0; i < OUT.length; i++){
    const data = new Uint8Array(await OUT[i].file.arrayBuffer());
    const nm = enc.encode(OUT[i].name), crc = crc32(data);
    const lh = new DataView(new ArrayBuffer(30));
    lh.setUint32(0, 0x04034b50, true); lh.setUint16(4, 20, true); lh.setUint16(6, 0x0800, true);
    lh.setUint16(10, time, true); lh.setUint16(12, date, true);
    lh.setUint32(14, crc, true); lh.setUint32(18, data.length, true); lh.setUint32(22, data.length, true);
    lh.setUint16(26, nm.length, true);
    parts.push(lh.buffer, nm, data);
    const ch = new DataView(new ArrayBuffer(46));
    ch.setUint32(0, 0x02014b50, true); ch.setUint16(4, 20, true); ch.setUint16(6, 20, true); ch.setUint16(8, 0x0800, true);
    ch.setUint16(12, time, true); ch.setUint16(14, date, true);
    ch.setUint32(16, crc, true); ch.setUint32(20, data.length, true); ch.setUint32(24, data.length, true);
    ch.setUint16(28, nm.length, true); ch.setUint32(42, offset, true);
    central.push(ch.buffer, nm);
    offset += 30 + nm.length + data.length;
  }
  const cdSize = central.reduce((s, p) => s + (p.byteLength ?? p.length), 0);
  const end = new DataView(new ArrayBuffer(22));
  end.setUint32(0, 0x06054b50, true); end.setUint16(8, OUT.length, true); end.setUint16(10, OUT.length, true);
  end.setUint32(12, cdSize, true); end.setUint32(16, offset, true);
  return new Blob([...parts, ...central, end.buffer], { type: 'application/zip' });
}

const blocked = e => e && (e.name === 'SecurityError' || /cross origin|sub frame/i.test(e.message || ''));

function save(blob, name){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([blob], { type: 'application/octet-stream' })); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}

  try {

    }
    if (fail.length) say('สำเร็จ ' + done + ' ไฟล์ ไม่สำเร็จ ' + fail.length + ': ' + fail.join(', ') + ' (ตรวจว่าเลือกโฟลเดอร์ที่มีไฟล์เหล่านี้อยู่)', 'bad');
    else say('เปลี่ยนชื่อในโฟลเดอร์เรียบร้อย ' + done + ' ไฟล์', 'ok');
  } catch (e) { if (e.name !== 'AbortError') say(blocked(e) ? 'หน้านี้เปิดอยู่ในกรอบแสดงตัวอย่าง จึงเปลี่ยนชื่อในโฟลเดอร์ไม่ได้ ให้บันทึกไฟล์ HTML ไว้ในเครื่องแล้วเปิดด้วย Chrome/Edge โดยตรง หรือใช้ปุ่มดาวน์โหลดแทน' : 'เกิดข้อผิดพลาด: ' + e.message, 'bad'); }
};

$('folder').onclick = async () => {
  if (!window.showDirectoryPicker){ say('เบราว์เซอร์นี้ไม่รองรับการบันทึกลงโฟลเดอร์ ใช้ Chrome หรือ Edge หรือกด "ดาวน์โหลดเป็น .IS2 (ทีละไฟล์)" แทน', 'bad'); return; }
  try {
    const dir = await showDirectoryPicker({ mode: 'readwrite' });
    for (let i = 0; i < OUT.length; i++){
      const h = await dir.getFileHandle(OUT[i].name, { create: true });
      const w = await h.createWritable();
      await w.write(OUT[i].file); await w.close();
    }
    say('บันทึก ' + OUT.length + ' ไฟล์ .IS2 ลงโฟลเดอร์แล้ว (เนื้อหาเหมือนเดิม เปลี่ยนแค่ชื่อ)', 'ok');
  } catch (e) {
    if (e.name === 'AbortError') return;
    if (blocked(e)){ say('หน้านี้เปิดอยู่ในกรอบแสดงตัวอย่าง จึงเลือกโฟลเดอร์ไม่ได้ กำลังดาวน์โหลดไฟล์ .IS2 ทั้งหมดให้แทน (ถ้าอยากเลือกโฟลเดอร์ ให้บันทึกไฟล์ HTML ไว้ในเครื่องแล้วเปิดด้วย Chrome/Edge โดยตรง)'); await $('each').onclick(); return; }
    say('เกิดข้อผิดพลาด: ' + e.message, 'bad');
  }
};

$('clear').onclick = () => { files = []; render(); };

function wire(dropEl, input, handler){
  dropEl.onclick = e => { if (e.target !== input) input.click(); };
  dropEl.onkeydown = e => { if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); input.click(); } };
  input.onchange = () => { handler(input.files); input.value = ''; };
  ['dragenter', 'dragover'].forEach(ev => dropEl.addEventListener(ev, e => { e.preventDefault(); dropEl.classList.add('over'); }));
  ['dragleave', 'drop'].forEach(ev => dropEl.addEventListener(ev, e => { e.preventDefault(); dropEl.classList.remove('over'); }));
  dropEl.addEventListener('drop', e => { e.stopPropagation(); handler(e.dataTransfer.files); });
}
wire($('drop'), $('pick'), addFiles);
wire($('dropX'), $('pickX'), l => { if (l[0]) loadSummary(l[0]); });
$('sep').addEventListener('input', render); $('noMode').addEventListener('change', render);
$('dupWord').addEventListener('input', render); $('incKeep').addEventListener('change', render);
[0, 1, 2].forEach(i => {
  const t = $('t' + i);
  t.onclick = () => showTab(i);
  t.onkeydown = e => {
    let j = null;
    if (e.key === 'ArrowRight') j = (i + 1) % 3; else if (e.key === 'ArrowLeft') j = (i + 2) % 3;
    else if (e.key === 'Home') j = 0; else if (e.key === 'End') j = 2;
    if (j === null) return;
    e.preventDefault(); showTab(j); $('t' + j).focus();
  };
});
/* วางไฟล์นอกกรอบ: กันเบราว์เซอร์เปิดไฟล์ทับหน้านี้ (ข้อมูลที่เลือกไว้จะหาย) และส่งต่อให้ถูกที่ */
['dragover', 'drop'].forEach(ev => window.addEventListener(ev, e => {
  if (!e.dataTransfer || !Array.from(e.dataTransfer.types || []).includes('Files')) return;
  e.preventDefault();
  if (ev !== 'drop') return;
  const l = Array.from(e.dataTransfer.files);
  const xl = l.filter(f => /\.xls[xm]$/i.test(f.name)), rest = l.filter(f => !/\.xls[xm]$/i.test(f.name));
  if (rest.length) addFiles(rest);
  if (xl.length) loadSummary(xl[0]);
}));
$('more').onclick = () => showTab(1);
showTab(0);
render();
</script>
